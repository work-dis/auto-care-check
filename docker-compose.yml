services:
  postgres:
    image: postgres:15-alpine
    container_name: autopulse-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: autopulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d autopulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/autopulse?schema=public
      - DIRECT_URL=postgresql://postgres:postgres@postgres:5432/autopulse?schema=public
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: autopulse-web
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/autopulse?schema=public
      - DIRECT_URL=postgresql://postgres:postgres@postgres:5432/autopulse?schema=public
      - PORT=3000
      - NODE_ENV=production
      - JWT_SECRET=autopulse-docker-secret-change-me
      - DATA_ENCRYPTION_KEY=autopulse-docker-data-key-change-me
      - CRON_SECRET=autopulse-docker-cron-secret-change-me
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: autopulse-worker
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/autopulse?schema=public
      - DIRECT_URL=postgresql://postgres:postgres@postgres:5432/autopulse?schema=public
      - NODE_ENV=production
      - JWT_SECRET=autopulse-docker-secret-change-me
      - DATA_ENCRYPTION_KEY=autopulse-docker-data-key-change-me
      - CRON_SECRET=autopulse-docker-cron-secret-change-me
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
